plugins { id "com.android.application" }

android {
    namespace "dk.lucas.skal"
    compileSdk 34
    ndkVersion System.getenv("NDK_VERSION") ?: "27.2.12479018"

    defaultConfig {
        applicationId "dk.lucas.skal"
        minSdk 24
        // targetSdk 28 (som Termux): så må programmer i appens egne mapper (fx ~/bin) køres.
        targetSdk 28
        versionCode 1
        versionName "1.0.0"
        ndk { abiFilters "arm64-v8a", "armeabi-v7a", "x86_64" }
    }

    // libtermux.so skal ligge udpakket
    packagingOptions { jniLibs { useLegacyPackaging true } }

    signingConfigs {
        release {
            def ks = System.getenv("KEYSTORE_FILE")
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEYSTORE_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv("KEYSTORE_FILE") ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint { abortOnError false; checkReleaseBuilds false }
}

dependencies {
    implementation project(":terminal-view")
}
