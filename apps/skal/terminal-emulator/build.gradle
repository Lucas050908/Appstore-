// Vendoret fra termux/termux-app v0.118.1 (Apache 2.0) – se NOTICE.md
plugins { id "com.android.library" }
android {
    namespace "com.termux.terminal"
    compileSdk 34
    ndkVersion System.getenv("NDK_VERSION") ?: "27.2.12479018"
    defaultConfig {
        minSdk 24
        externalNativeBuild { ndkBuild { cFlags "-std=c11", "-Wall", "-Os", "-fno-stack-protector", "-Wl,--gc-sections" } }
        ndk { abiFilters "arm64-v8a", "armeabi-v7a", "x86_64" }
    }
    externalNativeBuild { ndkBuild { path "src/main/jni/Android.mk" } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    lint { abortOnError false }
}
