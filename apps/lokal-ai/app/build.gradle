plugins { id "com.android.application" }

android {
    namespace "dk.lucas.lokalai"
    compileSdk 35
    ndkVersion System.getenv("NDK_VERSION") ?: "27.2.12479018"

    defaultConfig {
        applicationId "dk.lucas.lokalai"
        minSdk 28
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
        ndk { abiFilters "arm64-v8a" }
        externalNativeBuild {
            cmake {
                arguments "-DCMAKE_BUILD_TYPE=Release",
                          "-DANDROID_STL=c++_shared",
                          "-DBUILD_SHARED_LIBS=ON",
                          "-DLLAMA_BUILD_COMMON=ON",
                          "-DLLAMA_BUILD_APP=OFF",
                          "-DLLAMA_BUILD_TESTS=OFF",
                          "-DLLAMA_BUILD_TOOLS=OFF",
                          "-DLLAMA_BUILD_EXAMPLES=OFF",
                          "-DLLAMA_BUILD_SERVER=OFF",
                          "-DLLAMA_OPENSSL=OFF",
                          "-DGGML_NATIVE=OFF",
                          "-DGGML_BACKEND_DL=ON",
                          "-DGGML_CPU_ALL_VARIANTS=ON",
                          "-DGGML_LLAMAFILE=OFF"
            }
        }
    }

    externalNativeBuild {
        cmake { path "src/main/cpp/CMakeLists.txt" }
    }

    // Backends indlæses med dlopen fra nativeLibraryDir, så filerne skal pakkes ud
    packagingOptions { jniLibs { useLegacyPackaging true } }

    signingConfigs {
        release {
            def ks = System.getenv("KEYSTORE_FILE")
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEYSTORE_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv("KEYSTORE_FILE") ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint { abortOnError false; checkReleaseBuilds false }
}
