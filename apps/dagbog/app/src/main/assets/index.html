<!DOCTYPE html>
<html lang="da" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Dagbog</title>
<link rel="stylesheet" href="base.css">
<style>
.daynav { display: flex; align-items: center; gap: 6px; margin: 2px 0 12px; }
.daynav button { color: var(--ink-3); font-size: 20px; padding: 2px 8px; }
.daynav span { flex: 1; text-align: center; font: 700 22px var(--font-hand); color: var(--ink-2); }
.moods { display: flex; justify-content: space-between; gap: 8px; margin: 8px 0 4px; }
.moods button { flex: 1; aspect-ratio: 1; max-width: 62px; border-radius: 6px 6px 18px 6px; background: var(--fill); font-size: 28px; opacity: .55; transition: transform .2s var(--spring), opacity .15s; }
.moods button.on { opacity: 1; transform: scale(1.12) rotate(-3deg); background: var(--m); box-shadow: var(--st-shadow); }
.moodlbl { text-align: center; font: 700 22px var(--font-hand); min-height: 28px; color: var(--ink-2); }
.tags { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 6px; }
.tags button { padding: 7px 12px; border-radius: 99px; background: var(--fill); font-size: 13.5px; font-weight: 600; color: var(--ink-2); }
.tags button.on { background: var(--ink); color: var(--canvas); }
.page { padding: 16px 16px 12px; margin-top: 18px; }
.page .prompt { font: 700 21px/1.15 var(--font-hand); color: var(--st-ink-2); display: flex; justify-content: space-between; gap: 8px; }
.page textarea { width: 100%; min-height: 190px; border: 0; background: transparent; outline: none; resize: none; font: 400 17px/1.6 var(--font-display); color: var(--st-ink); margin-top: 8px;
  background-image: repeating-linear-gradient(transparent 0 26.2px, rgba(0,0,0,.09) 26.2px 27.2px); }
.page .meta { font-size: 12px; color: var(--st-ink-2); text-align: right; }
.grat { padding: 14px 16px; margin-top: 18px; }
.grat h3 { margin: 0 0 6px; font: 700 22px var(--font-hand); }
.grat input { width: 100%; border: 0; border-bottom: 1px dashed rgba(0,0,0,.2); background: transparent; padding: 8px 2px; font: 400 16px var(--font-display); color: var(--st-ink); outline: none; }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.cal .h { text-align: center; font-size: 11.5px; color: var(--ink-3); font-weight: 600; }
.cal button { aspect-ratio: 1; border-radius: 4px 4px 11px 4px; background: var(--fill); font-size: 13px; font-weight: 600; color: var(--ink-3); position: relative; }
.cal button.has { color: #1d1b17; background: var(--m); }
.cal button.today { outline: 2px solid var(--ink); outline-offset: 1px; }
.cal button.fut { opacity: .35; }
.cal button i { position: absolute; bottom: 3px; right: 5px; width: 5px; height: 5px; border-radius: 50%; background: #1d1b17; opacity: .5; }
.mnav { display: flex; justify-content: space-between; align-items: center; margin: 0 0 12px; }
.mnav span { font: 700 26px var(--font-hand); }
.mnav button { font-size: 22px; color: var(--ink-3); padding: 4px 10px; }
.legend { display: flex; justify-content: center; gap: 12px; margin-top: 12px; font-size: 18px; }
.stat { padding: 14px; }
.stat .k { font: 700 19px/1 var(--font-hand); color: var(--st-ink-2); }
.stat .v { font: 600 30px/1.15 var(--font-display); margin-top: 6px; }
.stat .s { font-size: 12.5px; color: var(--st-ink-2); }
.duo { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.bars { display: flex; gap: 8px; align-items: flex-end; height: 120px; padding: 0 6px; }
.bars div { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; font-size: 11px; color: var(--ink-3); }
.bars i { width: 100%; border-radius: 4px 4px 2px 2px; margin-bottom: 4px; min-height: 3px; }
.trow { display: flex; justify-content: space-between; align-items: center; padding: 10px 4px; border-bottom: 1px solid var(--line); }
.entry { padding: 14px 16px; margin-bottom: 14px; width: 100%; text-align: left; }
.entry .d { font: 700 20px var(--font-hand); color: var(--st-ink-2); }
.entry .t { font: 400 15px/1.5 var(--font-display); margin-top: 4px; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
.lock { position: fixed; inset: 0; z-index: 40; background: var(--canvas); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 20px; }
.lock .dots { display: flex; gap: 14px; } .lock .dots i { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--ink-2); }
.lock .dots i.on { background: var(--ink); border-color: var(--ink); }
.lock .pad { display: grid; grid-template-columns: repeat(3, 72px); gap: 14px; }
.lock .pad button { height: 72px; border-radius: 8px 8px 22px 8px; background: var(--fill); font: 600 26px var(--font-display); }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div><h1 id="title">I dag</h1><div class="sub" id="subtitle"></div></div>
    <button class="iconbtn" id="btnSet" aria-label="Indstillinger"></button>
  </header>
  <main id="main">
    <section class="screen on" id="s-today"></section>
    <section class="screen" id="s-calendar"></section>
    <section class="screen" id="s-insight"></section>
  </main>
</div>
<nav class="tabbar">
  <button class="tab on" data-tab="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h11a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6zM6 3v18M10 8h5M10 12h5"/></svg>Skriv</button>
  <button class="tab" data-tab="calendar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Kalender</button>
  <button class="tab" data-tab="insight"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 9 9h-9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/></svg>Indsigt</button>
</nav>
<script src="kit.js"></script>
<script>
Kit.key = "dagbog";
$("#btnSet").innerHTML = ICON.gear;
const MOODS = [[1, "😣", "Rigtig skidt", "#c9a3a9"], [2, "🙁", "Ikke så god", "#f1b3c4"], [3, "😐", "Okay", "#e6e0d3"], [4, "🙂", "God", "#b7e0a6"], [5, "😄", "Fantastisk", "#f3d867"]];
const TAGS = ["Arbejde", "Skole", "Familie", "Venner", "Kæreste", "Træning", "Natur", "Kreativ", "Læsning", "Gaming", "Godt måltid", "Sov godt", "Sov dårligt", "Træt", "Stress", "Syg", "Rejse", "Fest", "Alene-tid", "Produktiv"];
const PROMPTS = ["Hvad var det bedste ved i dag?", "Hvad lærte du i dag?", "Hvad fyldte mest i dine tanker?", "Hvem gjorde din dag bedre – og hvordan?", "Hvad er du stolt af i dag?", "Hvad ville du gøre anderledes?", "Hvad glæder du dig til i morgen?", "Hvad overraskede dig i dag?", "Hvornår følte du dig mest som dig selv?", "Hvad gav dig energi – og hvad tog den?", "Beskriv dagen med tre ord.", "Hvad har du skubbet foran dig, og hvorfor?"];
const D = Object.assign({ days: {}, theme: "system", tags: TAGS, remind: "21:00", remindOn: true, pin: "" }, Kit.load() || {});
const save = () => { Kit.save(D); pushWidget(); };
Kit.applyTheme(D.theme);
let cur = isoDay();
const day = d => D.days[d] || (D.days[d] = { mood: 0, tags: [], text: "", grat: ["", "", ""] });
const clean = () => { for (const [k, v] of Object.entries(D.days)) if (!v.mood && !v.text.trim() && !v.tags.length && !(v.grat || []).some(Boolean)) delete D.days[k]; };
const prompt = d => PROMPTS[(parseDay(d).getTime() / 864e5 | 0) % PROMPTS.length];
const mood = n => MOODS.find(m => m[0] === n);
const words = s => (s.trim().match(/\S+/g) || []).length;

/* ---------- skriv ---------- */
function renderToday() {
  const e = day(cur), el = $("#s-today"), isT = cur === isoDay();
  $("#title").textContent = isT ? "I dag" : dayName(cur).replace(/^./, c => c.toUpperCase());
  $("#subtitle").textContent = parseDay(cur).toLocaleDateString("da-DK", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
  el.innerHTML = `
    <div class="daynav"><button id="dp">‹</button><span>${isT ? "Hvordan har du det?" : "Hvordan havde du det?"}</span><button id="dn" ${isT ? "style='opacity:.2' disabled" : ""}>›</button></div>
    <div class="moods">${MOODS.map(([n, em, , c]) => `<button data-m="${n}" class="${e.mood === n ? "on" : ""}" style="--m:${c}">${em}</button>`).join("")}</div>
    <div class="moodlbl">${e.mood ? mood(e.mood)[2] : ""}</div>
    <div class="tags">${D.tags.map(t => `<button data-t="${esc(t)}" class="${e.tags.includes(t) ? "on" : ""}">${esc(t)}</button>`).join("")}<button id="addTag">+</button></div>
    <div class="sticky st-yellow tape page"><div class="prompt"><span id="pr">${esc(prompt(cur))}</span><button id="np" style="font:600 13px var(--font-ui);color:var(--st-ink-2)">Nyt spørgsmål</button></div>
      <textarea id="txt" placeholder="Skriv løs …">${esc(e.text)}</textarea><div class="meta" id="wc"></div></div>
    <div class="sticky st-green tilt-b grat"><h3>Tre ting jeg er taknemmelig for</h3>${[0, 1, 2].map(i => `<input data-g="${i}" placeholder="${i + 1}." value="${esc((e.grat || [])[i] || "")}">`).join("")}</div>`;
  const wc = () => { const n = words(e.text); $("#wc").textContent = n ? `${n} ord · gemt` : ""; };
  wc();
  let t;
  $("#txt").oninput = ev => { e.text = ev.target.value; clearTimeout(t); t = setTimeout(() => { save(); wc(); }, 400); };
  $("#txt").onblur = () => { clean(); save(); };
  $$("[data-g]", el).forEach(i => i.oninput = () => { e.grat = e.grat || ["", "", ""]; e.grat[+i.dataset.g] = i.value; clearTimeout(t); t = setTimeout(save, 400); });
  $$("[data-m]", el).forEach(b => b.onclick = () => { e.mood = e.mood === +b.dataset.m ? 0 : +b.dataset.m; Kit.haptic(); save(); $$("[data-m]", el).forEach(x => x.classList.toggle("on", +x.dataset.m === e.mood)); $(".moodlbl").textContent = e.mood ? mood(e.mood)[2] : ""; });
  $$("[data-t]", el).forEach(b => b.onclick = () => { const tg = b.dataset.t; e.tags = e.tags.includes(tg) ? e.tags.filter(x => x !== tg) : [...e.tags, tg]; b.classList.toggle("on"); Kit.haptic(); save(); });
  $("#addTag").onclick = () => Kit.sheet(`<h2>Nyt mærke</h2><input class="input" id="nt" placeholder="Fx Musik"><div class="row-btns"><button class="btn" id="tc">Annullér</button><button class="btn dark" id="ts">Tilføj</button></div>`, () => {
    $("#nt").focus(); $("#tc").onclick = Kit.closeSheet;
    $("#ts").onclick = () => { const v = $("#nt").value.trim(); if (v && !D.tags.includes(v)) { D.tags.push(v); e.tags.push(v); save(); } Kit.closeSheet(); renderToday(); };
  });
  $("#np").onclick = () => { const i = PROMPTS.indexOf($("#pr").textContent); $("#pr").textContent = PROMPTS[(i + 1) % PROMPTS.length]; };
  $("#dp").onclick = () => { clean(); save(); cur = addDays(cur, -1); renderToday(); };
  $("#dn").onclick = () => { clean(); save(); if (cur < isoDay()) { cur = addDays(cur, 1); renderToday(); } };
}

/* ---------- kalender ---------- */
let calOff = 0, calQ = "";
function renderCalendar() {
  const el = $("#s-calendar"), base = new Date(); base.setDate(1); base.setMonth(base.getMonth() + calOff);
  const y = base.getFullYear(), m = base.getMonth(), first = (new Date(y, m, 1).getDay() + 6) % 7, n = new Date(y, m + 1, 0).getDate(), t = isoDay();
  const entries = Object.keys(D.days).length;
  $("#subtitle").textContent = `${entries} dage skrevet`;
  let cells = ["M", "T", "O", "T", "F", "L", "S"].map(d => `<div class="h">${d}</div>`).join("") + "<div></div>".repeat(first);
  for (let i = 1; i <= n; i++) { const d = `${y}-${pad(m + 1)}-${pad(i)}`, e = D.days[d], mo = e && e.mood ? mood(e.mood) : null;
    cells += `<button data-d="${d}" class="${e ? "has" : ""} ${d === t ? "today" : ""} ${d > t ? "fut" : ""}" style="${mo ? `--m:${mo[3]}` : e ? "--m:var(--st-white)" : ""}">${i}${e && e.text.trim() ? "<i></i>" : ""}</button>`; }
  const list = calQ ? Object.entries(D.days).filter(([, e]) => (e.text + " " + e.tags.join(" ") + " " + (e.grat || []).join(" ")).toLowerCase().includes(calQ.toLowerCase())).sort((a, b) => b[0].localeCompare(a[0])) : [];
  el.innerHTML = `<input class="input" id="cq" type="search" placeholder="Søg i dagbogen" value="${esc(calQ)}" style="margin-bottom:14px">
    ${calQ ? (list.map(([d, e], i) => `<button class="sticky st-${STICKIES[i % 6]} ${TILTS[i % 4]} entry" data-d="${d}"><div class="d">${e.mood ? mood(e.mood)[1] + " " : ""}${dayName(d).replace(/^./, c => c.toUpperCase())} ${parseDay(d).getFullYear() !== new Date().getFullYear() ? parseDay(d).getFullYear() : ""}</div><div class="t">${esc(e.text || e.tags.join(", "))}</div></button>`).join("") || `<div class="empty">Intet fundet</div>`)
    : `<div class="mnav"><button id="cp">‹</button><span>${MONTHS[m].replace(/^./, c => c.toUpperCase())} ${y}</span><button id="cn" ${calOff >= 0 ? "style='opacity:.2' disabled" : ""}>›</button></div>
      <div class="card" style="padding:12px"><div class="cal">${cells}</div><div class="legend">${MOODS.map(x => `<span title="${x[2]}">${x[1]}</span>`).join("")}</div></div>
      <div class="section-title">Denne måned</div>${Object.entries(D.days).filter(([d]) => d.startsWith(`${y}-${pad(m + 1)}`) && D.days[d].text.trim()).sort((a, b) => b[0].localeCompare(a[0])).map(([d, e], i) => `<button class="sticky st-${STICKIES[i % 6]} ${TILTS[i % 4]} entry" data-d="${d}"><div class="d">${e.mood ? mood(e.mood)[1] + " " : ""}${dayName(d).replace(/^./, c => c.toUpperCase())}</div><div class="t">${esc(e.text)}</div></button>`).join("") || `<div class="empty">Ingen tekst skrevet i ${MONTHS[m]}</div>`}`}`;
  const q = $("#cq"); q.oninput = () => { calQ = q.value; const p = q.selectionStart; renderCalendar(); const n2 = $("#cq"); n2.focus(); n2.setSelectionRange(p, p); };
  const cp = $("#cp"); if (cp) { cp.onclick = () => { calOff--; renderCalendar(); }; $("#cn").onclick = () => { if (calOff < 0) { calOff++; renderCalendar(); } }; }
  $$("[data-d]", el).forEach(b => b.onclick = () => { if (b.dataset.d > isoDay()) return; cur = b.dataset.d; Kit.setTab("today"); });
}

/* ---------- indsigt ---------- */
function streak() { let s = 0, d = isoDay(); if (!D.days[d]) d = addDays(d, -1); while (D.days[d]) { s++; d = addDays(d, -1); } return s; }
function renderInsight() {
  const el = $("#s-insight"), all = Object.entries(D.days).filter(([, e]) => e.mood);
  const last30 = all.filter(([d]) => d > addDays(isoDay(), -30));
  const avg = a => a.length ? a.reduce((s, [, e]) => s + e.mood, 0) / a.length : 0;
  const wd = [1, 2, 3, 4, 5, 6, 0].map(w => { const a = all.filter(([d]) => parseDay(d).getDay() === w); return { w, a: avg(a), n: a.length }; });
  const tagStats = D.tags.map(t => { const w = all.filter(([, e]) => e.tags.includes(t)); return { t, n: w.length, diff: w.length >= 2 ? avg(w) - avg(all.filter(([, e]) => !e.tags.includes(t))) : null }; }).filter(x => x.diff !== null).sort((a, b) => b.diff - a.diff);
  const totalWords = Object.values(D.days).reduce((s, e) => s + words(e.text), 0);
  const moodTxt = v => v ? mood(Math.round(v))[1] + " " + NF.format(Math.round(v * 10) / 10) : "–";
  $("#subtitle").textContent = "Hvad påvirker dit humør?";
  el.innerHTML = `<div class="duo">
      <div class="sticky st-yellow tilt-a stat"><div class="k">Streak</div><div class="v">${streak()} dage</div><div class="s">i træk</div></div>
      <div class="sticky st-green tilt-b stat"><div class="k">Humør, 30 dage</div><div class="v">${moodTxt(avg(last30))}</div><div class="s">${last30.length} dage registreret</div></div>
      <div class="sticky st-blue tilt-c stat"><div class="k">Skrevet</div><div class="v">${NF.format(totalWords)} ord</div><div class="s">${Object.values(D.days).filter(e => e.text.trim()).length} dage med tekst</div></div>
      <div class="sticky st-pink tilt-d stat"><div class="k">Bedste dag</div><div class="v">${(() => { const b = wd.filter(x => x.n).sort((a, c) => c.a - a.a)[0]; return b ? WDAYS[b.w].replace(/^./, c => c.toUpperCase()) : "–"; })()}</div><div class="s">i gennemsnit</div></div></div>
    <div class="section-title">Humør pr. ugedag</div>
    <div class="card" style="padding:14px 8px 8px"><div class="bars">${wd.map(x => `<div><i style="height:${x.a / 5 * 90}%;background:${x.a ? mood(Math.round(x.a))[3] : "var(--fill-2)"}"></i>${WDAYS[x.w].slice(0, 3)}</div>`).join("")}</div></div>
    <div class="section-title">Det gør dig glad<small>sammenlignet med andre dage</small></div>
    ${tagStats.length ? tagStats.map(x => `<div class="trow"><span>${esc(x.t)} <small class="muted">(${x.n})</small></span><b style="color:${x.diff > .05 ? "var(--ok)" : x.diff < -.05 ? "var(--danger)" : "var(--ink-3)"}">${x.diff > 0 ? "+" : ""}${NF.format(Math.round(x.diff * 10) / 10)}</b></div>`).join("") : `<div class="empty">Brug mærker et par dage – så kan Dagbog vise, hvad der løfter eller trækker dit humør.</div>`}`;
}

/* ---------- påmindelser, lås, widget ---------- */
function scheduleReminders() {
  for (let i = 0; i < 7; i++) Kit.cancel("rem" + i);
  if (!D.remindOn) return;
  const [h, m] = D.remind.split(":").map(Number);
  for (let i = 0; i < 7; i++) {
    const d = new Date(); d.setDate(d.getDate() + i); d.setHours(h, m, 0, 0);
    if (d.getTime() <= Date.now()) continue;
    if (i === 0 && D.days[isoDay()] && (D.days[isoDay()].text.trim() || D.days[isoDay()].mood)) continue;
    Kit.schedule("rem" + i, d.getTime(), "Hvordan var din dag?", prompt(isoDay(d)), "write");
  }
}
function pushWidget() {
  const e = D.days[isoDay()], s = streak();
  Kit.widget({ title: "Dagbog", value: e && e.mood ? `${mood(e.mood)[1]} ${mood(e.mood)[2]}` : "Hvordan har du det?", sub: s ? `${s} dage i træk` : "Skriv dagens første linje",
    lines: e && e.text.trim() ? [e.text.trim().split("\n")[0].slice(0, 80)] : [prompt(isoDay())], hash: "write", quickHash: "write" });
}
async function sha(s) { const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("dagbog:" + s)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join(""); }
function lockScreen(onOk, setMode) {
  let pin = "", first = "";
  const el = document.createElement("div"); el.className = "lock"; document.body.appendChild(el);
  const draw = msg => {
    el.innerHTML = `<div class="hand" style="font-size:32px">${msg}</div><div class="dots">${[0, 1, 2, 3].map(i => `<i class="${i < pin.length ? "on" : ""}"></i>`).join("")}</div>
      <div class="pad">${[1, 2, 3, 4, 5, 6, 7, 8, 9, "", 0, "⌫"].map(k => `<button data-k="${k}" ${k === "" ? "style='visibility:hidden'" : ""}>${k}</button>`).join("")}</div>${setMode ? `<button id="lc" class="muted">Annullér</button>` : ""}`;
    $$("[data-k]", el).forEach(b => b.onclick = async () => {
      const k = b.dataset.k; Kit.haptic();
      if (k === "⌫") pin = pin.slice(0, -1); else if (pin.length < 4) pin += k;
      draw(msg);
      if (pin.length < 4) return;
      if (setMode) { if (!first) { first = pin; pin = ""; return draw("Gentag koden"); } if (pin === first) { D.pin = await sha(pin); save(); el.remove(); Kit.toast("Kode sat"); onOk && onOk(); } else { first = ""; pin = ""; draw("Prøv igen"); } return; }
      if (await sha(pin) === D.pin) { el.remove(); Kit.onBack = null; onOk && onOk(); } else { pin = ""; Kit.haptic("heavy"); draw("Forkert kode"); }
    });
    const lc = $("#lc", el); if (lc) lc.onclick = () => el.remove();
  };
  if (!setMode) Kit.onBack = () => true;
  draw(setMode ? "Vælg en kode" : "Skriv din kode");
}
let lockedAt = 0;
window.onNativePause = () => { lockedAt = Date.now(); };
Kit.onResume = () => { if (D.pin && lockedAt && Date.now() - lockedAt > 60000 && !$(".lock")) lockScreen(); if (Kit.tab === "today" && cur !== isoDay() && !Kit.sheetOpen()) { /* behold valgt dag */ } };
$("#btnSet").onclick = () => Kit.sheet(`<h2>Indstillinger</h2>
  <div class="field"><span class="lbl">Daglig påmindelse</span><label class="switch"><input type="checkbox" id="ro" ${D.remindOn ? "checked" : ""}><span></span></label></div>
  <div class="field"><span class="lbl">Tidspunkt</span><input type="time" class="input" id="rt" value="${D.remind}" style="width:auto"></div>
  <div class="field"><span class="lbl">Lås med kode</span><button class="val" id="pinb">${D.pin ? "Fjern ›" : "Sæt kode ›"}</button></div>
  <div class="field" style="display:block"><div class="lbl" style="margin-bottom:8px">Tema</div><div class="seg" id="th">${[["system", "System"], ["light", "Lyst"], ["dark", "Mørkt"]].map(([k, n]) => `<button data-k="${k}" class="${D.theme === k ? "on" : ""}">${n}</button>`).join("")}</div></div>
  <div class="field"><span class="lbl">Eksportér som tekst</span><button class="val" id="ex">Del ›</button></div>
  <div class="field"><span class="lbl">Backup / gendan</span><span><button class="val" id="bk">Gem</button> · <button class="val" id="rr">Gendan</button></span></div>
  <p class="muted" style="font-size:13px">Dagbog ${esc(Kit.version())} · Alt gemmes kun på telefonen. Koden beskytter mod nysgerrige blikke, men er ikke kryptering.</p>`, sh => {
  $("#ro").onchange = e => { D.remindOn = e.target.checked; save(); scheduleReminders(); };
  $("#rt").onchange = e => { D.remind = e.target.value || "21:00"; save(); scheduleReminders(); };
  $("#pinb").onclick = () => { Kit.closeSheet(); if (D.pin) lockScreen(() => { D.pin = ""; save(); Kit.toast("Koden er fjernet"); }); else lockScreen(null, true); };
  $$("#th button", sh).forEach(b => b.onclick = () => { D.theme = b.dataset.k; save(); Kit.applyTheme(D.theme); $$("#th button", sh).forEach(x => x.classList.toggle("on", x === b)); });
  $("#ex").onclick = () => Kit.share(`dagbog-${isoDay()}.md`, "text/markdown", "# Dagbog\n\n" + Object.entries(D.days).sort((a, b) => a[0].localeCompare(b[0])).map(([d, e]) => `## ${parseDay(d).toLocaleDateString("da-DK", { weekday: "long", day: "numeric", month: "long", year: "numeric" })}${e.mood ? " " + mood(e.mood)[1] : ""}\n${e.tags.length ? "_" + e.tags.join(", ") + "_\n\n" : ""}${e.text}\n${(e.grat || []).filter(Boolean).length ? "\nTaknemmelig for:\n" + e.grat.filter(Boolean).map(g => "- " + g).join("\n") + "\n" : ""}`).join("\n"));
  $("#bk").onclick = () => Kit.share(`dagbog-backup-${isoDay()}.json`, "application/json", JSON.stringify(D));
  $("#rr").onclick = () => Kit.pickFile(t => { try { const j = JSON.parse(t); if (!j.days) throw 0; Object.assign(D, j); save(); Kit.closeSheet(); Kit.setTab(Kit.tab); Kit.toast("Gendannet"); } catch (e) { Kit.toast("Ikke en Dagbog-backup"); } });
});
Kit.onTab = t => { clean(); save(); if (t === "today") renderToday(); if (t === "calendar") renderCalendar(); if (t === "insight") renderInsight(); };
Kit.onHash = h => { if (h === "write") { cur = isoDay(); Kit.setTab("today"); setTimeout(() => $("#txt") && $("#txt").focus(), 200); } else if (Kit.tabs[h]) Kit.setTab(h); };
Kit.initTabs({ today: "I dag", calendar: "Kalender", insight: "Indsigt" }, "today");
scheduleReminders(); pushWidget();
if (D.pin) lockScreen();
</script>
</body>
</html>
