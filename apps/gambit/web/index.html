<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Gambit</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="pieces.css">
</head>
<body>
<div id="app">
  <header class="top">
    <h1>Gambit</h1>
    <div class="mode" id="modeLabel"></div>
  </header>

  <main class="play">
    <div class="boardcol">
      <div class="player" id="pTop">
        <div class="avatar"><span class="pc"></span></div>
        <div class="pinfo"><div class="pname"></div><div class="caps"></div></div>
        <div class="think" aria-hidden="true"><i></i><i></i><i></i></div>
        <div class="clock" hidden></div>
      </div>

      <div class="boardwrap">
        <div class="board" id="board">
          <div class="squares" id="squares"></div>
          <div class="pieces" id="pieces"></div>
          <svg class="arrows" id="arrows" viewBox="0 0 8 8"></svg>
        </div>
      </div>

      <div class="player" id="pBot">
        <div class="avatar"><span class="pc"></span></div>
        <div class="pinfo"><div class="pname"></div><div class="caps"></div></div>
        <div class="think" aria-hidden="true"><i></i><i></i><i></i></div>
        <div class="clock" hidden></div>
      </div>
    </div>

    <div class="side">
      <div class="status" id="status"></div>
      <div class="nav" id="nav" hidden>
        <button id="navFirst" aria-label="Til start"><svg viewBox="0 0 24 24"><path d="M18 6l-7 6 7 6M7 6v12"/></svg></button>
        <button id="navPrev" aria-label="Forrige træk"><svg viewBox="0 0 24 24"><path d="M15 6l-7 6 7 6"/></svg></button>
        <div id="navText"></div>
        <button id="navNext" aria-label="Næste træk"><svg viewBox="0 0 24 24"><path d="M9 6l7 6-7 6"/></svg></button>
        <button id="navClose" aria-label="Luk gennemgang"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <div class="moves" id="moves"></div>
      <nav class="actions">
        <button id="btnNew" class="act primary" aria-label="Nyt spil">
          <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>Nyt spil</span>
        </button>
        <button id="btnUndo" class="act" aria-label="Fortryd">
          <svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg><span>Fortryd</span>
        </button>
        <button id="btnHint" class="act" aria-label="Tip">
          <svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.7.6 1.1 1.3 1.1 2.2h5c0-.9.4-1.6 1.1-2.2A6 6 0 0 0 12 3z"/></svg><span>Tip</span>
        </button>
        <button id="btnFlip" class="act" aria-label="Vend brættet">
          <svg viewBox="0 0 24 24"><path d="M7 4v16M7 20l-3-3M7 20l3-3"/><path d="M17 20V4M17 4l-3 3M17 4l3 3"/></svg><span>Vend</span>
        </button>
        <button id="btnMore" class="act" aria-label="Mere">
          <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg><span>Mere</span>
        </button>
      </nav>
      <nav class="actions four" id="pacts" hidden>
        <button id="pzClose" class="act" aria-label="Luk opgaver">
          <svg viewBox="0 0 24 24"><path d="M15 6l-7 6 7 6"/></svg><span>Til partiet</span>
        </button>
        <button id="pzRetry" class="act" aria-label="Forfra">
          <svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.700M4 4v5h5"/></svg><span>Forfra</span>
        </button>
        <button id="pzHint" class="act" aria-label="Tip">
          <svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.600 10.800c.700.600 1.100 1.300 1.100 2.200h5c0-.900.400-1.600 1.100-2.200A6 6 0 0 0 12 3z"/></svg><span>Tip</span>
        </button>
        <button id="pzNext" class="act primary" aria-label="Næste opgave">
          <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg><span>Næste</span>
        </button>
      </nav>
    </div>
  </main>
</div>

<!-- Nyt spil -->
<div class="scrim" id="newScrim" hidden>
  <div class="note green sheet" role="dialog" aria-labelledby="newTitle">
    <div class="tape"></div>
    <h2 id="newTitle">Nyt spil</h2>
    <div class="field">
      <div class="lbl">Modstander</div>
      <div class="seg" data-key="mode">
        <button data-v="cpu">Computer</button>
        <button data-v="pvp">2 spillere</button>
      </div>
    </div>
    <div class="field cpuonly">
      <div class="lbl">Niveau <span id="lvlName"></span></div>
      <div class="seg lvls" data-key="level">
        <button data-v="1">1</button><button data-v="2">2</button><button data-v="3">3</button><button data-v="4">4</button><button data-v="5">5</button>
      </div>
    </div>
    <div class="field cpuonly">
      <div class="lbl">Du spiller som</div>
      <div class="seg" data-key="color">
        <button data-v="w"><span class="pc wk mini"></span>Hvid</button>
        <button data-v="r">Tilfældig</button>
        <button data-v="b"><span class="pc bk mini"></span>Sort</button>
      </div>
    </div>
    <div class="field">
      <div class="lbl">Betænkningstid</div>
      <div class="seg" data-key="tc">
        <button data-v="0">Uden ur</button><button data-v="5">5 min</button><button data-v="10">10 min</button><button data-v="15">15 + 10</button>
      </div>
    </div>
    <div class="record cpuonly" id="record"></div>
    <div class="row">
      <button class="btn ghost" id="newCancel">Annuller</button>
      <button class="btn dark" id="newStart">Start</button>
    </div>
    <div class="fold"></div>
  </div>
</div>

<!-- Forvandling -->
<div class="scrim" id="promoScrim" hidden>
  <div class="note yellow promo">
    <div class="tape"></div>
    <h2>Forvandl til</h2>
    <div class="promos" id="promos"></div>
    <div class="fold"></div>
  </div>
</div>

<!-- Slut -->
<div class="scrim" id="endScrim" hidden>
  <div class="note yellow end">
    <div class="tape"></div>
    <h2 id="endTitle"></h2>
    <p id="endText"></p>
    <div class="row">
      <button class="btn ghost" id="endLook">Brættet</button>
      <button class="btn ghost" id="endRev">Gennemgå</button>
      <button class="btn ghost" id="endPgn" aria-label="Del partiet">Del</button>
      <button class="btn dark" id="endNew">Nyt spil</button>
    </div>
    <div class="fold"></div>
  </div>
</div>

<!-- Mere -->
<div class="scrim" id="moreScrim" hidden>
  <div class="note blue sheet">
    <div class="tape"></div>
    <h2>Mere</h2>
    <div class="menu">
      <button id="mPuz"><b>Opgaver</b><span id="mPuzSub"></span></button>
      <button id="mRev"><b>Gennemgå partiet</b><span>Find brølere og bedre træk</span></button>
      <button id="mPgn"><b>Del partiet</b><span>Kopiér trækkene som PGN</span></button>
      <button id="mResign"><b>Giv op</b><span>Afslut partiet her</span></button>
    </div>
    <div class="field" style="margin-top:14px">
      <div class="lbl">Brættets farver</div>
      <div class="seg" data-key="theme" id="themeSeg">
        <button data-v="salvie">Salvie</button><button data-v="blaa">Blå</button><button data-v="trae">Træ</button><button data-v="graa">Grå</button>
      </div>
    </div>
    <div class="field">
      <div class="lbl">Lyd</div>
      <div class="seg" id="soundSeg">
        <button data-v="1">Til</button><button data-v="0">Fra</button>
      </div>
    </div>
    <div class="row"><button class="btn dark" id="moreClose">Luk</button></div>
    <div class="about" id="about"></div>
    <div class="fold"></div>
  </div>
</div>

<!-- Opgaver -->
<div class="scrim" id="puzScrim" hidden>
  <div class="note green sheet">
    <div class="tape"></div>
    <h2>Opgaver</h2>
    <p>Find trækket, der tvinger mat. Hver opgave har kun én løsning.</p>
    <div class="menu">
      <button id="pzDaily" class="daily"><b>Dagens opgave</b><span id="pzD"></span></button>
      <button data-set="m1"><b>Mat i 1</b><span id="pz1"></span></button>
      <button data-set="m2"><b>Mat i 2</b><span id="pz2"></span></button>
    </div>
    <div class="row" style="margin-top:16px"><button class="btn ghost" id="puzCancel">Luk</button></div>
    <div class="fold"></div>
  </div>
</div>

<!-- Gennemgang -->
<div class="scrim" id="revScrim" hidden>
  <div class="note yellow end">
    <div class="tape"></div>
    <h2>Gennemgang</h2>
    <div id="revGraph"></div>
    <div id="revText"></div>
    <div class="row">
      <button class="btn ghost" id="revClose">Luk</button>
      <button class="btn dark" id="revGo">Se trækkene</button>
    </div>
    <div class="fold"></div>
  </div>
</div>

<!-- Del partiet -->
<div class="scrim" id="pgnScrim" hidden>
  <div class="note blue sheet">
    <div class="tape"></div>
    <h2>Del partiet</h2>
    <p id="pgnInfo"></p>
    <textarea id="pgnText" readonly rows="8" spellcheck="false" aria-label="Partiet som PGN"></textarea>
    <div class="row">
      <button class="btn ghost" id="pgnClose">Luk</button>
      <button class="btn ghost" id="pgnShare">Del</button>
      <button class="btn dark" id="pgnCopy">Kopiér</button>
    </div>
    <div class="fold"></div>
  </div>
</div>

<!-- Nyt -->
<div class="scrim" id="newsScrim" hidden>
  <div class="note yellow sheet">
    <div class="tape"></div>
    <h2>Nyt i Gambit</h2>
    <ul id="newsList" class="news"></ul>
    <div class="row"><button class="btn dark" id="newsClose">Fint</button></div>
    <div class="fold"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="engine.js"></script>
<script src="puzzles.js"></script>
<script src="app.js"></script>
</body>
</html>
