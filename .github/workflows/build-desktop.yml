name: Byg App Store til Windows og Linux

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["desktop/**", "store/index.html", "store/base.css", "apps/**", "apks/**", "shared/build_site.py", ".github/workflows/build-desktop.yml"]

permissions:
  contents: write

concurrency:
  group: build-desktop
  cancel-in-progress: true

jobs:
  test-ai:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Test Lokal AI med en rigtig model (Qwen 2.5 0.5B)
        shell: bash
        working-directory: desktop
        run: |
          npm install --no-audit --no-fund
          node test-ai-node.js "https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf" qwen2.5-0.5b-instruct-q4_k_m.gguf "København|Copenhagen|Kobenhavn"
      - name: Test at den anbefalede model (Gemma 4 E2B) kan indlæses
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        working-directory: desktop
        run: node test-ai-node.js "https://huggingface.co/unsloth/gemma-4-E2B-it-GGUF/resolve/main/gemma-4-E2B-it-Q4_K_M.gguf" gemma-4-E2B-it-Q4_K_M.gguf

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
            file: LucasAppStore-Setup.exe
          - os: ubuntu-latest
            script: dist:linux
            file: LucasAppStore.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Kopiér butikken og apps ind i programmet
        shell: bash
        run: |
          mkdir -p desktop/store
          cp -r store/index.html store/base.css store/fonts desktop/store/
          PY=$(command -v python3 || command -v python)
          $PY shared/build_site.py --desktop desktop/apps-web
      - name: Byg
        shell: bash
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npm install --no-audit --no-fund
          npm run ${{ matrix.script }}
          ls -la dist
      - name: Test på Windows (genvej og Husopsparing direkte)
        if: matrix.os == 'windows-latest'
        shell: bash
        working-directory: desktop
        run: |
          EXE="dist/win-unpacked/Lucas App Store.exe"
          LAS_TEST_SC=husopsparing LAS_SHOT_APPS="$RUNNER_TEMP/w" timeout 90 "$EXE" || true
          LAS_SHOT_APPS="$RUNNER_TEMP/w" timeout 90 "$EXE" --open=husopsparing || true
          ls -la "$RUNNER_TEMP" | grep "w-" || true
          powershell -NoProfile -Command '$d=[Environment]::GetFolderPath("Desktop"); $l=Join-Path $d "Husopsparing.lnk"; if(Test-Path $l){ $s=(New-Object -ComObject WScript.Shell).CreateShortcut($l); "GENVEJ OK: " + $s.TargetPath + " " + $s.Arguments + " ikon=" + $s.IconLocation } else { "GENVEJ MANGLER" }'
          powershell -NoProfile -Command 'Get-ChildItem "$env:APPDATA\Lucas App Store" -Recurse -Depth 2 | Select-Object -First 15 FullName'
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'windows-latest'
        with:
          name: windows-test-skaermbilleder
          path: ${{ runner.temp }}/w-*.png
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.file }}
          path: desktop/dist/${{ matrix.file }}
      - name: Tjek at AI-motoren er med i pakken
        shell: bash
        run: |
          ls desktop/dist/*-unpacked/resources/app.asar.unpacked/node_modules/@node-llama-cpp/ || true
          du -sh desktop/dist/${{ matrix.file }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Læg filerne på udgivelsen "desktop"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la out
          VER=$(python3 -c "import json;print(json.load(open('desktop/package.json'))['version'])")
          gh release view desktop >/dev/null 2>&1 || gh release create desktop --title "Lucas App Store til Windows og Linux" --notes "Hent App Store til computeren." --target main
          gh release edit desktop --title "Lucas App Store $VER til Windows og Linux" --notes "Windows: hent LucasAppStore-Setup.exe og kør den. Linux: hent LucasAppStore.AppImage, gør den kørbar (chmod +x) og start den. Version $VER."
          gh release upload desktop out/* --clobber
