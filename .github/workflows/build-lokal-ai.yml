name: Byg Lokal AI APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["apps/lokal-ai/**", ".github/workflows/build-lokal-ai.yml"]

permissions:
  contents: write

concurrency:
  group: build-lokal-ai
  cancel-in-progress: true

env:
  LLAMA_COMMIT: a8575a3ef4e2631d0540b2879fff86ad8411dbf6

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Hent llama.cpp (fast commit)
        run: |
          git init apps/lokal-ai/llama.cpp
          cd apps/lokal-ai/llama.cpp
          git remote add origin https://github.com/ggml-org/llama.cpp
          git fetch --depth 1 origin "$LLAMA_COMMIT"
          git checkout FETCH_HEAD

      - name: Byg og signer APK
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/android/signing/release.jks
          KEYSTORE_PASSWORD: "7BzhKh3fj9JiufNfLn7HHjco"
          KEY_ALIAS: appstore
        run: |
          export NDK_VERSION=$(basename "$ANDROID_NDK_LATEST_HOME")
          echo "NDK: $NDK_VERSION"
          set -o pipefail
          gradle -p apps/lokal-ai assembleRelease --no-daemon --stacktrace 2>&1 | tee /tmp/build.log

      - name: Gem byggelog ved fejl
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/logs && cp /tmp/build.log /tmp/logs/lokal-ai.log 2>/dev/null || echo "ingen log" > /tmp/logs/lokal-ai.log
          git fetch origin ci-logs && git checkout ci-logs || git checkout --orphan ci-logs
          git rm -rf --quiet . 2>/dev/null || true
          tail -c 400000 /tmp/logs/lokal-ai.log > lokal-ai.log
          git add lokal-ai.log && git commit -m "Byggelog ${{ github.sha }}" && git push origin ci-logs

      - name: Læg APK i apks/ og opdater butikken
        run: |
          VER=$(grep -oP 'versionName "\K[^"]+' apps/lokal-ai/app/build.gradle)
          APK=apks/LokalAI-$VER.apk
          cp apps/lokal-ai/app/build/outputs/apk/release/app-release.apk "$APK"
          ls -la "$APK"
          unzip -l "$APK" | grep "\.so" || true
          pip install --quiet androguard pillow
          python3 add_app.py "$APK" store --download "https://raw.githubusercontent.com/Lucas050908/Appstore-/main/$APK"
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add "$APK" store/apps.json store/icons
          git diff --cached --quiet || git commit -m "Byg Lokal AI $VER (${{ github.sha }})"
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
