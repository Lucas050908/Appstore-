name: Byg App Store APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["android/**", "store/index.html", ".github/workflows/build-store.yml"]

permissions:
  contents: write

concurrency:
  group: build-store
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Læg butikssiden ind i appen
        run: |
          mkdir -p android/app/src/main/assets
          cp store/index.html store/apps.json android/app/src/main/assets/

      - name: Byg og signer APK
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/android/signing/release.jks
          KEYSTORE_PASSWORD: "7BzhKh3fj9JiufNfLn7HHjco"
          KEY_ALIAS: appstore
        run: |
          gradle -p android assembleRelease --no-daemon
          mkdir -p apks
          cp android/app/build/outputs/apk/release/app-release.apk apks/LucasAppStore.apk
          ls -la apks/LucasAppStore.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LucasAppStore
          path: apks/LucasAppStore.apk

      - name: Gem APK og størrelse i repoet
        run: |
          python3 - <<'PY'
          import json, os, re
          p = "store/apps.json"; d = json.load(open(p, encoding="utf-8"))
          g = open("android/app/build.gradle").read()
          ver = re.search(r'versionName "([^"]+)"', g).group(1)
          code = re.search(r'versionCode (\d+)', g).group(1)
          for a in d["apps"]:
              if a.get("pkg") == "dk.lucas.appstore":
                  a["size"] = os.path.getsize("apks/LucasAppStore.apk")
                  a["version"], a["build"] = ver, code
          json.dump(d, open(p, "w", encoding="utf-8"), ensure_ascii=False, indent=2)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add apks/LucasAppStore.apk store/apps.json
          git diff --cached --quiet || git commit -m "Byg App Store APK (${{ github.sha }})"
          git push
